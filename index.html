<style>
:root {
  /* Rozvržení: úzký sloupec pro telefon; nahoře stav a lepkavý pruh filtrů, pod ním kartičky po dnech */
  --bg: #f3f6f6; --surface: #ffffff; --fg: #15282e; --muted: #5a6d72; --line: #d5e0e1;
  --accent: #1f5566; --accent-soft: #e2eef0; --ok: #2e7d4f; --ok-soft: #e3f2e8;
  --warn: #b5631c; --warn-soft: #fbeedd; --no: #a23b3b; --no-soft: #f8e6e6;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1a1d; --surface: #16252a; --fg: #e3eef0; --muted: #93a8ad; --line: #26393f;
  --accent: #7cc3d6; --accent-soft: #1b3740; --ok: #6fcf97; --ok-soft: #173327;
  --warn: #f0a868; --warn-soft: #3a2a19; --no: #f08c8c; --no-soft: #3a1d1d; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1a1d; --surface: #16252a; --fg: #e3eef0; --muted: #93a8ad; --line: #26393f;
  --accent: #7cc3d6; --accent-soft: #1b3740; --ok: #6fcf97; --ok-soft: #173327;
  --warn: #f0a868; --warn-soft: #3a2a19; --no: #f08c8c; --no-soft: #3a1d1d; color-scheme: dark; }
body { background: var(--bg); color: var(--fg); font: 17px/1.55 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 44rem; margin: 0 auto; padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 22px; }
h1, h2 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.2rem; font-weight: 650; }
.label { font: 500 0.72rem/1.3 var(--f-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
header { display: grid; gap: 6px; }
header p { margin: 0; color: var(--muted); }
.filters { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  padding-block: 10px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.f { flex: none; font: 600 0.9rem/1 var(--f-body); padding: 10px 14px; min-height: 40px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.f b { font: 500 0.78rem var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.f[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.f[aria-pressed="true"] b { color: var(--surface); opacity: 0.85; }
.sync { font: 400 0.8rem var(--f-mono); color: var(--muted); }
.day { display: grid; gap: 12px; }
.cards { display: grid; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 10px; min-width: 0; }
.card[data-s="libi"] { border-color: var(--ok); box-shadow: inset 4px 0 0 var(--ok); }
.card[data-s="nelibi"] { opacity: 0.7; }
.card h3 { margin: 0; font: 650 1.1rem/1.3 var(--f-body); }
.card h3 a { color: var(--fg); text-decoration: none; }
.card h3 a:hover { color: var(--accent); text-decoration: underline; }
.firma { color: var(--muted); margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 0.78rem/1.2 var(--f-mono); padding: 5px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); overflow-wrap: anywhere; }
.chip.money { background: var(--ok-soft); color: var(--ok); }
.chip.dim { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.proc, .pozor { margin: 0; }
.pozor { background: var(--warn-soft); border-radius: 8px; padding: 8px 10px; font-size: 0.95rem; }
.pozor strong { color: var(--warn); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.tags { display: flex; gap: 6px; }
.t { font: 600 0.88rem/1 var(--f-body); min-height: 40px; padding: 0 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
.t[data-v="libi"][aria-pressed="true"] { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.t[data-v="mozna"][aria-pressed="true"] { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.t[data-v="nelibi"][aria-pressed="true"] { background: var(--no-soft); border-color: var(--no); color: var(--no); }
.go { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--surface);
  background: var(--accent); padding: 0 16px; border-radius: 8px; text-decoration: none; min-height: 40px; }
.go small { font: 400 0.75rem var(--f-mono); opacity: 0.85; }
a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.empty { color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 20px; margin: 0; }
@media (max-width: 420px) { h1 { font-size: 1.65rem; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.tools { display: flex; flex-wrap: wrap; gap: 8px; }
.tool { font: 600 0.88rem/1 var(--f-body); min-height: 40px; padding: 0 14px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.hint { background: var(--accent-soft); color: var(--fg); border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; }
.hint p { margin: 0; }
.hint[hidden] { display: none; }
.hint .tool { justify-self: start; }
</style>

  const DNY = ["Neděle","Pondělí","Úterý","Středa","Čtvrtek","Pátek","Sobota"];
  const NAZVY = { libi: "Líbí", mozna: "Možná", nelibi: "Nelíbí" };
  const FILTRY = [["vse","Vše"],["nove","Neoznačené"],["libi","Líbí"],["mozna","Možná"],["nelibi","Nelíbí"]];
  const $ = (id) => document.getElementById(id);
  const $list = $("list"), $filters = $("filters"), $status = $("status");

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const read = (k, fallback) => { try { const v = localStorage.getItem(k); return v === null ? fallback : JSON.parse(v); } catch (e) { return fallback; } };
  const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };
  const clean = (obj) => Object.fromEntries(Object.entries(obj || {})
    .filter(([u, s]) => typeof u === "string" && /^https?:\/\//.test(u) && (s === "" || NAZVY[s])));

  // Výchozí štítky jen při úplně prvním otevření (prázdný localStorage).
  let labels = read(LS, null);
  if (!labels || typeof labels !== "object") { labels = clean(DATA.vychozi); store(LS, labels); }
  let filter = read(LSF, "vse");
  if (!FILTRY.some(([f]) => f === filter)) filter = "vse";

  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  const offers = DATA.nabidky;
  const stitek = (n) => labels[n.url] || "";
  const matches = (n, f) => { const s = stitek(n); return f === "vse" ? s !== "nelibi" : f === "nove" ? !s : s === f; };
  const say = (text) => { $status.textContent = text; };

  function card(n) {
    const s = stitek(n);
    const money = n.mzda && n.mzda !== "neuvedena";
    const tags = ["libi","mozna","nelibi"].map((v) =>
      `<button class="t" type="button" data-u="${esc(n.url)}" data-v="${v}" aria-pressed="${s === v}">${NAZVY[v]}</button>`).join("");
    return `<article class="card" data-s="${s}">
      <h3><a href="${esc(n.url)}" target="_blank" rel="noopener noreferrer">${esc(n.pozice)}</a></h3>
      <p class="firma">${esc(n.firma)}</p>
      <div class="chips"><span class="chip">${esc(n.misto)}</span><span class="chip">${esc(n.ho)}</span>
        <span class="chip ${money ? "money" : "dim"}">${esc(money ? n.mzda : "mzda neuvedena")}</span>
        <span class="chip dim">shoda: ${esc(n.shoda)}</span></div>
      <div class="row"><div class="tags" role="group" aria-label="Štítek">${tags}</div>
        <a class="go" href="${esc(n.url)}" target="_blank" rel="noopener noreferrer">Otevřít <small>${esc(n.web)}</small></a></div>

    const shown = offers.filter((n) => matches(n, filter));
    if (!shown.length) {
      const prazdne = { libi: "Zatím nic se štítkem Líbí. Klepni na Líbí u nabídky, která tě zaujme.",
        mozna: "Zatím nic se štítkem Možná.", nelibi: "Zatím nic se štítkem Nelíbí.",
        nove: "Všechno máš označené.", vse: "Žádné nabídky." };

  $("zaloha").addEventListener("click", async () => {
    const dnes = new Date().toISOString().slice(0, 10);

  render();
})();
</script>

<script>

(() => {
  const el = document.getElementById("dojezd-data"), $list = document.getElementById("list");
  const zdroj = document.getElementById("data");
  if (!el || !$list || !zdroj) return;
  let DJ, NAB;
  try { DJ = JSON.parse(el.textContent); NAB = JSON.parse(zdroj.textContent).nabidky || []; } catch (e) { return; }
  const NABIDKA = new Map(NAB.map((n) => [n.url, n]));
  const DLOUHA_MIN = 75, BLIZKO_MIN = 45, TYDNU_V_MESICI = 52 / 12, DNU_BENZIN = 21;
  const LSD = "dojezd-filtr-v1";
  const cti = () => { try { return { blizko: false, radit: false, ...JSON.parse(localStorage.getItem(LSD) || "{}") }; } catch (e) { return { blizko: false, radit: false }; } };
  let volby = cti();

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const svg = (d) => `<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;

    ok: svg('<path d="M5 12l4 4 10-10"/>'),
    hodiny: svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
    vlak: svg('<rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M9 21l1.5-4M15 21l-1.5-4"/>'),

.dj-why { margin: 0; font-size: 0.92rem; color: var(--muted); }
.dj-why strong { color: var(--fg); }
.dj-why a { color: var(--accent); font-weight: 600; white-space: nowrap; }
.dj-lines { margin: 0; font: 400 0.74rem/1.3 var(--f-mono); color: var(--muted); overflow-wrap: anywhere; }
.dj[data-dlouha="true"] .dj-why strong { color: var(--warn); }
.dj-time { margin: 0; font: 500 0.8rem/1.35 var(--f-mono); color: var(--fg); display: flex; gap: 6px; align-items: center; }
.dj-time svg { width: 15px; height: 15px; color: var(--muted); flex: none; }
.dj-also { margin: 0; font-size: 0.88rem; color: var(--muted); }
.dj-also a { color: var(--accent); font-weight: 600; }
.card[hidden], .day[hidden] { display: none !important; }
#list > .day:not([hidden]) ~ .day:not([hidden]) { margin-top: 26px; }
/* Dva řádky nahoře: štítky (stránka) + dojezd (tenhle skript), oba přilepené */
.dj-sticky { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); min-width: 0;
  padding-bottom: 8px; box-shadow: 0 1px 0 var(--line); }
.dj-sticky .filters { position: static; padding-bottom: 6px; }
.dj-bar { display: flex; align-items: center; gap: 8px; min-width: 0; }
.dj-lbl { flex: none; display: inline-flex; align-items: center; gap: 5px; min-height: 36px; padding: 0 2px;
  border: 0; background: none; color: var(--muted); cursor: pointer; font: 500 0.72rem/1 var(--f-mono);
  text-transform: uppercase; letter-spacing: 0.08em; }
.dj-lbl svg, .dj-sort svg { width: 16px; height: 16px; flex: none; }
.dj-seg { display: inline-flex; flex: none; padding: 2px; gap: 2px; border-radius: 10px;
  background: var(--surface); border: 1px solid var(--line); }
.dj-seg button { min-height: 32px; padding: 0 11px; border: 0; border-radius: 8px; background: none; cursor: pointer;
  color: var(--muted); font: 600 0.84rem/1 var(--f-body); display: inline-flex; align-items: center; gap: 5px; }
.dj-seg button b { font: 500 0.74rem var(--f-mono); font-variant-numeric: tabular-nums; opacity: 0.8; }
.dj-seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.dj-sort { margin-left: auto; flex: none; min-height: 36px; padding: 0 4px; border: 0; background: none; cursor: pointer;
  display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font: 600 0.84rem/1 var(--f-body); }
.dj-sort[aria-pressed="true"] { color: var(--accent); }
.dj-sort[aria-pressed="true"] span { text-decoration: underline; text-underline-offset: 3px; }
.dj-info { margin: 6px 0 0; font: 400 0.76rem/1.4 var(--f-mono); color: var(--muted); }
.dj-info[hidden] { display: none; }
@media (max-width: 380px) { .dj-sort span, .dj-lbl span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); } }
@media (max-width: 360px) { .dj-opts { grid-template-columns: 1fr; } }`;
  document.head.appendChild(css);


  function blok(d, n) {
    if (!d || d.nejasne) return `<div class="dj"><p class="dj-why">Místo není v inzerátu přesné, dojezd jsem nespočítal.</p></div>`;
    const volba = d.volba;
    const opts = [];
    if (volba === "pesky") {
      opts.push(`<div class="dj-o dj-solo" data-win="true">${IKONA.pesky}<div><b>${d.km ?? "<4"} km</b><span>pěšky nebo na kole</span></div><i class="dj-chk">${IKONA.ok}</i></div>`);
    } else {
      opts.push(d.mhd != null
        ? `<div class="dj-o" data-win="${volba === "mhd"}">${IKONA.mhd}<div><b>${d.mhd} min</b><span>${prestupy(d.prestupy)}</span></div>${volba === "mhd" ? `<i class="dj-chk">${IKONA.ok}</i>` : ""}</div>`
        : `<div class="dj-o">${IKONA.mhd}<div><b>—</b><span>spoj nenalezen</span></div></div>`);
      opts.push(d.auto != null
        ? `<div class="dj-o" data-win="${volba === "auto"}">${IKONA.auto}<div><b>${d.auto} min</b><span>${d.km} km</span></div>${volba === "auto" ? `<i class="dj-chk">${IKONA.ok}</i>` : ""}</div>`
        : `<div class="dj-o">${IKONA.auto}<div><b>—</b><span>trasa neznámá</span></div></div>`);
    }
    const nejrychleji = Math.min(d.mhd ?? Infinity, d.auto ?? Infinity);
    const dlouha = volba !== "pesky" && nejrychleji > DLOUHA_MIN;
    const titulek = dlouha ? `Dlouhá cesta, vyplatí se ${NAZEV[volba]}.` : volba === "oboji" ? "MHD i auto vychází podobně." : `Vyplatí se ${NAZEV[volba]}.`;
    const dny = dnyVKancelari(n && n.ho);
    const cestMesicne = dny * TYDNU_V_MESICI;
    const benzinKc = d.benzin ? Math.round(d.benzin * cestMesicne / DNU_BENZIN / 100) * 100 : 0;
    const benzin = benzinKc && volba !== "pesky" ? ` Benzín tam a zpět ≈ ${kc(benzinKc)} měsíčně.` : "";
    const cas = casCesty(d);
    const hodiny = Number.isFinite(cas) && volba !== "pesky"
      ? `<p class="dj-time">${IKONA.hodiny}<span>≈ ${Math.round(cas * 2 * cestMesicne / 60)} h měsíčně na cestě · ${DNY_SLOVY[dny]} v týdnu v kanceláři</span></p>` : "";
    const odkaz = d.idos ? ` <a href="${esc(d.idos)}" target="_blank" rel="noopener noreferrer">Spojení v IDOS ↗</a>` : "";
    const linky = d.linky && d.linky.length ? `<p class="dj-lines">${d.linky.map(esc).join(" → ")}${d.cil ? ` · do ${esc(d.cil)}, dál MHD po městě` : ""}</p>` : "";
    return `<div class="dj" data-dlouha="${dlouha}"><div class="dj-opts">${opts.join("")}</div>
      ${hodiny}<p class="dj-why"><strong>${esc(titulek)}</strong> ${esc(d.duvod || "")}${esc(benzin)}${odkaz}</p>${linky}</div>`;
  }

  function jinde(n) {
    if (!n || !Array.isArray(n.jinde) || !n.jinde.length) return "";
    return `<p class="dj-also">Stejná nabídka i na: ${n.jinde.map((j) =>
      `<a href="${esc(j.url)}" target="_blank" rel="noopener noreferrer">${esc(j.web || "jiném webu")} ↗</a>`).join(", ")}</p>`;
  }

  function dopln() {
    $list.querySelectorAll(".card").forEach((card) => {
      if (card.querySelector(".dj")) return;
      const a = card.querySelector("h3 a");
      const n = a && NABIDKA.get(a.getAttribute("href"));
      if (!n) return;
      card.dataset.cesta = String(casCesty(DJ.mista[n.misto]));
      const chips = card.querySelector(".chips");
      (chips || card.firstElementChild).insertAdjacentHTML("afterend", blok(DJ.mista[n.misto], n) + jinde(n));
    });
    pouzijFiltr();
    lista();
  }

  // Filtr „do 45 min“ a řazení podle dojezdu: jen skrývá/přeskupuje hotové kartičky, štítků se nedotýká.
  function pouzijFiltr() {
    $list.querySelectorAll(".day").forEach((den) => {
      const box = den.querySelector(".cards");
      const karty = [...den.querySelectorAll(".card")];
      karty.forEach((k) => { k.hidden = volby.blizko && !(+k.dataset.cesta <= BLIZKO_MIN); });
      if (box && volby.radit) {
        karty.map((k, i) => [k, i]).sort((a, b) => (+a[0].dataset.cesta - +b[0].dataset.cesta) || a[1] - b[1])
          .forEach(([k]) => box.appendChild(k));
      }
      den.hidden = karty.every((k) => k.hidden);
    });
    let prazdno = $list.querySelector(".dj-empty");
    const nicVidet = volby.blizko && $list.querySelector(".card") && !$list.querySelector(".card:not([hidden])");
    if (nicVidet && !prazdno) $list.insertAdjacentHTML("beforeend", `<p class="empty dj-empty">V tomhle výběru nic do ${BLIZKO_MIN} minut cesty.</p>`);
    if (!nicVidet && prazdno) prazdno.remove();
  }

  // Druhý řádek pod štítky: segmentový přepínač „Vše | Do 45 min“ + tichý přepínač řazení.
  // Je mimo <nav> stránky, takže ho její překreslování filtrů nesmaže.
  const $filters = document.getElementById("filters");
  let $bar = null;
  if ($filters) {
    const obal = document.createElement("div");
    obal.className = "dj-sticky";
    $filters.before(obal);
    obal.append($filters);
    obal.insertAdjacentHTML("beforeend", `<div class="dj-bar" role="group" aria-label="Filtr podle dojezdu">
      <button class="dj-lbl" type="button" aria-expanded="false" aria-controls="dj-info">${IKONA.vlak}<span>Dojezd</span></button>
      <div class="dj-seg"></div>
      <button class="dj-sort" type="button" data-dj="radit" aria-label="Nejbližší první">${IKONA.radit}<span>Nejbližší první</span></button></div>
      <p class="dj-info" id="dj-info" hidden>Počítáno z: ${esc(DJ.odkud)} · ráno ve všední den · zelená = vyplatí se víc</p>`);
    $bar = obal;
    obal.addEventListener("click", (e) => {
      const lbl = e.target.closest(".dj-lbl");
      if (lbl) {
        const info = obal.querySelector(".dj-info"), otevrit = info.hidden;
        info.hidden = !otevrit; lbl.setAttribute("aria-expanded", String(otevrit));
        return;
      }
      const b = e.target.closest("[data-dj]"); if (!b) return;
      const novy = b.dataset.dj === "radit" ? { radit: !volby.radit } : { blizko: b.dataset.dj === "blizko" };
      volby = { ...volby, ...novy };
      try { localStorage.setItem(LSD, JSON.stringify(volby)); } catch (err) { /* jen pro tuto návštěvu */ }
      if (b.dataset.dj === "radit" && !volby.radit) { // původní pořadí: nechat stránku překreslit aktuální filtr
        const aktivni = $filters.querySelector('.f[aria-pressed="true"]');
        if (aktivni) { aktivni.click(); return; }
      }
      pouzijFiltr(); lista();
    });
  }
  function lista() {
    if (!$bar) return;
    const karty = [...$list.querySelectorAll(".card")];
    const blizkych = karty.filter((k) => +k.dataset.cesta <= BLIZKO_MIN).length;
    $bar.querySelector(".dj-seg").innerHTML =
      `<button type="button" data-dj="vse" aria-pressed="${!volby.blizko}">Vše</button>` +
      `<button type="button" data-dj="blizko" aria-pressed="${volby.blizko}">Do ${BLIZKO_MIN} min <b>${blizkych}</b></button>`;
    $bar.querySelector(".dj-sort").setAttribute("aria-pressed", String(volby.radit));
  }

  new MutationObserver(dopln).observe($list, { childList: true });
  dopln();
})();

</script>
